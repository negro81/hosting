<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneo de Pádel</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <h1 id="nombreTorneo">Torneo de Pádel</h1>
    <nav>
      <button onclick="mostrarPantalla('pantallaCanchas')">Canchas y Horarios</button>
      <button onclick="mostrarPantalla('pantallaParejas')">Parejas</button>
      <button onclick="mostrarPantalla('pantallaZonas')">Zonas</button>
      <button onclick="mostrarPantalla('pantallaLlaves')">Llaves Finales</button>
    </nav>
  </header>

  <main>
    <!-- Pantalla Canchas y Horarios -->
    <section id="pantallaCanchas" class="pantalla">
      <h2>Canchas y Horarios</h2>
      <label>Nombre de cancha: <input type="text" id="nombreCancha" /></label>
      <label>Horario (ej: 9:00-13:00): <input type="text" id="rangoHorario" /></label>
      <button onclick="agregarCanchaHorario()">Agregar</button>
      <div id="listaCanchas"></div>
    </section>

    <!-- Pantalla Parejas -->
    <section id="pantallaParejas" class="pantalla">
      <h2>Registro de Parejas</h2>
      <label>Pareja (Apellido1 / Apellido2): <input type="text" id="nombrePareja" /></label>
      <button onclick="agregarPareja()">Agregar Pareja</button>
      <div id="listaParejas"></div>
    </section>

    <!-- Pantalla Zonas -->
    <section id="pantallaZonas" class="pantalla">
      <h2>Zonas</h2>
      <button onclick="generarZonas()">Generar Zonas</button>
      <div id="zonasGeneradas"></div>
    </section>

    <!-- Pantalla Llaves Finales -->
    <section id="pantallaLlaves" class="pantalla">
      <h2>Llaves Finales</h2>
      <button onclick="generarLlavesFinales()">Generar Llaves</button>
      <div id="llavesGeneradas"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
