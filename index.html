<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torneo Padel</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <h1 id="nombreTorneo">Torneo Padel</h1>
    <nav>
      <button data-seccion="configuracion" class="nav-btn activa">Configuración</button>
      <button data-seccion="parejas" class="nav-btn">Parejas</button>
      <button data-seccion="canchas" class="nav-btn">Canchas & Horarios</button>
      <button data-seccion="zonas" class="nav-btn">Zonas y Resultados</button>
      <button data-seccion="llaves" class="nav-btn">Llaves Finales</button>
    </nav>
  </header>

  <main>
    <!-- Configuración Torneo -->
    <section id="configuracion" class="seccion activa">
      <h2>Configuración del Torneo</h2>
      <label>Nombre del torneo: <input type="text" id="inputNombreTorneo" placeholder="Ej: Torneo Verano 2025"/></label>
      <button id="btnGuardarNombreTorneo">Guardar nombre</button>
      <hr />
    </section>

    <!-- Parejas -->
    <section id="parejas" class="seccion">
      <h2>Carga de Parejas</h2>
      <form id="formParejas" onsubmit="return false;">
        <input type="text" id="apellido1" placeholder="Apellido jugador 1" required />
        <input type="text" id="apellido2" placeholder="Apellido jugador 2" required />
        <button id="btnAgregarPareja">Agregar Pareja</button>
      </form>
      <ul id="listaParejas"></ul>
    </section>

    <!-- Canchas y Horarios -->
    <section id="canchas" class="seccion">
      <h2>Carga de Canchas y Horarios</h2>
      <form id="formCanchas" onsubmit="return false;">
        <input type="text" id="nombreCancha" placeholder="Nombre cancha" required />
        <button id="btnAgregarCancha">Agregar Cancha</button>
      </form>
      <div id="listaCanchas"></div>

      <hr />

      <h3>Horarios del torneo</h3>
      <p>Indicar rango horario para cada día:</p>
      <label>Viernes desde: <input type="time" id="horaInicioViernes" required /></label>
      <label>Viernes hasta: <input type="time" id="horaFinViernes" required /></label><br />
      <label>Sábado desde: <input type="time" id="horaInicioSabado" required /></label>
      <label>Sábado hasta: <input type="time" id="horaFinSabado" required /></label><br />
      <label>Domingo desde: <input type="time" id="horaInicioDomingo" required /></label>
      <label>Domingo hasta: <input type="time" id="horaFinDomingo" required /></label><br />
      <button id="btnGuardarHorarios">Guardar horarios</button>
      <div id="mensajeHorarios"></div>
    </section>

    <!-- Zonas y Resultados -->
    <section id="zonas" class="seccion">
      <h2>Zonas y Resultados (Viernes y Sábado)</h2>
      <button id="btnGenerarZonas">Generar Zonas</button>
      <div id="contenedorZonas"></div>
    </section>

    <!-- Llaves Finales -->
    <section id="llaves" class="seccion">
      <h2>Llaves Finales (Domingo)</h2>
      <button id="btnGenerarLlaves">Generar Llaves Finales</button>
      <div id="llavesContainer"></div>
    </section>

    <footer>
      <button id="btnReiniciar">Reiniciar Torneo (Borrar todo)</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
